[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexilearn"
version = "1.0.0"
description = "AI-powered English reading assistant with vocabulary management"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "LexiLearn Team", email = "team@lexilearn.dev" }
]
maintainers = [
    { name = "LexiLearn Team", email = "team@lexilearn.dev" }
]
keywords = ["english", "learning", "vocabulary", "nlp", "education", "reading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.8"
dependencies = [
    "aiohttp==3.9.5",
    "aiofiles==23.2.1",
    "nltk==3.8.1",
    "tqdm==4.66.4",
    "python-dotenv==1.0.1",
    "pydantic==2.7.4",
    "structlog==24.1.0",
    "psutil==5.9.8",
    "typing-extensions==4.12.2"
]

[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "flake8==7.0.0",
    "isort==5.13.2",
    "mypy==1.10.0",
    "pylint==3.2.3",
    "pre-commit==3.7.1",
    "sphinx==7.3.7",
    "sphinx-rtd-theme==2.0.0",
    "sphinx-autodoc-typehints==2.1.0",
    "jupyter==1.0.0",
    "ipykernel==6.29.4",
    "pip-tools==7.4.1",
    "twine==5.1.0",
    "build==1.2.1",
    "bandit==1.7.9",
    "safety==3.2.3",
    "memory-profiler==0.61.0",
    "line-profiler==4.1.3",
    "types-requests==2.32.0.20240622",
    "types-aiofiles==23.2.0.20240406"
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "pytest-aiohttp>=1.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-doctestplus>=1.2.0",
    "factory-boy>=3.3.0",
    "aioresponses>=0.7.0",
    "responses>=0.25.0",
    "freezegun>=1.5.0",
    "hypothesis>=6.103.0",
    "coverage>=7.5.0",
    "types-requests>=2.32.0",
    "types-aiofiles>=23.2.0",
    "pre-commit>=3.7.0"
]
all = [
    "lexilearn[dev,test]"
]

[project.urls]
Homepage = "https://github.com/lexilearn/lexilearn"
Documentation = "https://lexilearn.readthedocs.io/"
Repository = "https://github.com/lexilearn/lexilearn"
"Bug Tracker" = "https://github.com/lexilearn/lexilearn/issues"
Changelog = "https://github.com/lexilearn/lexilearn/releases"

[project.scripts]
lexilearn = "lexilearn.main:main"
lexilearn-setup = "lexilearn.setup_nltk:setup"
lexilearn-validate = "lexilearn.validate:main"