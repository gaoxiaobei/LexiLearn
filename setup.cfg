[metadata]
name = lexilearn
version = 1.0.0
author = LexiLearn Team
author_email = team@lexilearn.dev
description = AI-powered English reading assistant with vocabulary management
readme = README.md
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/lexilearn/lexilearn
project_urls =
    Bug Tracker = https://github.com/lexilearn/lexilearn/issues
    Documentation = https://lexilearn.readthedocs.io/
    Source Code = https://github.com/lexilearn/lexilearn
license = MIT
license_file = LICENSE
keywords = english, learning, vocabulary, nlp, education, reading
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Education
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Education
    Topic :: Text Processing :: Linguistic
    Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = find:
python_requires = >=3.8
include_package_data = True
zip_safe = False
install_requires =
    aiohttp>=3.9.0,<4.0.0
    aiofiles>=23.0.0
    nltk>=3.8.0
    tqdm>=4.65.0
    python-dotenv>=1.0.0
    pydantic>=2.0.0
    structlog>=24.0.0
    typing-extensions>=4.0.0

[options.packages.find]
exclude =
    tests*
    docs*
    examples*

[options.extras_require]
dev =
    black>=24.0.0
    flake8>=7.0.0
    isort>=5.13.0
    mypy>=1.10.0
    pylint>=3.2.0
    pre-commit>=3.7.0
    sphinx>=7.3.0
    sphinx-rtd-theme>=2.0.0
    sphinx-autodoc-typehints>=2.1.0
    jupyter>=1.0.0
    ipykernel>=6.29.0
    pip-tools>=7.4.0
    twine>=5.1.0
    build>=1.2.0
    bandit>=1.7.0
    safety>=3.2.0
    memory-profiler>=0.61.0
    line-profiler>=4.1.0
    types-requests>=2.32.0
    types-aiofiles>=23.2.0
test =
    pytest>=8.0.0
    pytest-asyncio>=0.23.0
    pytest-cov>=5.0.0
    pytest-mock>=3.14.0
    pytest-xdist>=3.6.0
    factory-boy>=3.3.0
    aioresponses>=0.7.0
    pytest-aiohttp>=1.0.0
    coverage>=7.5.0
    pytest-benchmark>=4.0.0
    pytest-bandit>=0.6.0
    pytest-mypy>=0.10.0
    freezegun>=1.5.0
    responses>=0.25.0
    pytest-doctestplus>=1.2.0
    hypothesis>=6.103.0
all = lexilearn[dev,test]

[options.entry_points]
console_scripts =
    lexilearn = lexilearn.main:main
    lexilearn-setup = lexilearn.setup_nltk:setup
    lexilearn-validate = lexilearn.validate:main

[options.package_data]
* = *.txt, *.rst, *.md
lexilearn = data/*.txt, templates/*.html, static/css/*.css, static/js/*.js

[bdist_wheel]
universal = 0

[flake8]
max-line-length = 88
extend-ignore = E203, W503, E501
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    .tox,
    .pytest_cache

[isort]
profile = black
multi_line_output = 3
line_length = 88
known_first_party = lexilearn
skip = .venv,venv,build,dist

[mypy]
python_version = 3.8
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[mypy-nltk.*]
ignore_missing_imports = true

[mypy-tqdm.*]
ignore_missing_imports = true

[mypy-aiohttp.*]
ignore_missing_imports = true

[mypy-aiofiles.*]
ignore_missing_imports = true

[tool:pytest]
minversion = 6.0
addopts = -ra -q --strict-markers --strict-config
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    asyncio: marks tests as async

[coverage:run]
source = lexilearn
omit = 
    */tests/*
    */test_*
    download_nltk_data.py
    */venv/*
    */virtualenv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*